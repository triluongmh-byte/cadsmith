<html lang="en">

<title>cadsmith studio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1016;--panel:#11151d;--rail:#0b0e13;--line:#1f2531;--line2:#2a3140;--btn:#171c26;--text:#e6e9ef;--soft:#b8bfcc;--dim:#8a93a3;--orange:#f08a3c;--blue:#7fb0ff;--on:#15305a;--onText:#9cc4ff;--ok:#7ee2a0;--okBg:#16301f;--okLine:#24523a;--bad:#ff9b86;--badBg:#3a1d17;--warn:#f6a766;--warnBg:#2a1d12;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:13px/1.45 Inter,system-ui,sans-serif;display:grid;grid-template-rows:52px minmax(0,1fr);overflow:hidden}
button,input,textarea{font:inherit;color:inherit}
.hv{transition:background-color .12s,color .12s,border-color .12s}
.hv:hover,.hv:focus-visible{background:rgba(240,138,60,.16)!important;color:#ffb27a!important;border-color:var(--orange)!important;outline:0}
.btn{height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line2);background:var(--btn);color:var(--text);display:inline-flex;align-items:center;gap:7px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn svg{flex:none}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#1a1108;font-weight:600}.btn.primary:hover,.btn.primary:focus-visible{background:#ffa25a!important;color:#1a1108!important}
header{display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.mark{width:26px;height:26px;border-radius:7px;background:var(--orange);display:grid;place-items:center;flex:none}
.brand{font-weight:600;font-size:15px;margin:0 6px 0 4px}
.switch{position:relative}
.switch>button{max-width:260px}.switch .label{overflow:hidden;text-overflow:ellipsis;font-weight:600}
.menu{position:absolute;top:40px;left:0;z-index:40;width:300px;max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:10px;padding:6px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.menu a{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:7px;color:var(--text);text-decoration:none}
.menu a:hover{background:var(--btn)}.menu a.on{background:var(--on);color:var(--onText)}
.menu .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.menu .v{font:11px var(--mono);color:var(--dim)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex:none}.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.run{background:var(--orange)}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--btn);color:var(--dim);border:1px solid var(--line2);white-space:nowrap;margin-left:4px}
.pill.ok{background:var(--okBg);color:var(--ok);border-color:var(--okLine)}.pill.bad{background:var(--badBg);color:var(--bad);border-color:#5b2c22}.pill.run{background:var(--warnBg);color:var(--warn);border-color:#4a3320}
.grow{flex:1}.sep{width:1px;height:22px;background:var(--line2);margin:0 4px}
.app{display:grid;grid-template-columns:64px minmax(0,1fr) 400px;min-height:0}
nav{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 0}
nav button{width:54px;padding:8px 0;border-radius:10px;border:0;background:transparent;color:#9aa3b2;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav button.on{background:var(--on);color:var(--onText);font-weight:600}
.view{position:relative;min-width:0;min-height:0;overflow:hidden;background-color:#0f141d;background-image:linear-gradient(rgba(120,150,200,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,200,.08) 1px,transparent 1px);background-size:40px 40px}
.view canvas{position:absolute;inset:0;display:block;width:100%!important;height:100%!important}
.tools{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:4px;padding:6px;border-radius:14px;background:rgba(17,21,29,.92);border:1px solid #263044;z-index:5}
.tools button{width:40px;height:40px;border-radius:10px;border:0;background:transparent;color:var(--soft);display:grid;place-items:center;cursor:pointer;font-size:10.5px;font-weight:600}
.tools button.on{background:#2b5bd7;color:#fff}
.tools hr{width:100%;border:0;height:1px;background:#263044;margin:2px 0}
.chips{position:absolute;top:14px;right:14px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;z-index:5}
.chips span{font-size:12px;padding:6px 10px;border-radius:8px;background:rgba(17,21,29,.92);border:1px solid #263044;color:#9aa3b2}.chips b{font-weight:600;color:var(--text)}
.hint{position:absolute;left:16px;right:16px;bottom:10px;display:flex;justify-content:space-between;font:11px var(--mono);color:var(--dim);gap:8px;z-index:5;pointer-events:none}
.hint .synced{color:var(--ok)}
.alert{position:absolute;left:72px;top:14px;max-width:min(560px,60%);padding:9px 12px;border-radius:10px;background:var(--badBg);color:#ffc4b8;border:1px solid #5b2c22;font-size:12px;white-space:pre-wrap;z-index:6;max-height:130px;overflow:auto}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--soft);text-align:center;padding:24px;font-size:15px;line-height:1.6}.empty small{display:block;color:var(--dim);font-size:13px}
.gizmo{position:absolute;right:14px;bottom:34px;width:104px;height:104px;z-index:5}.gizmo g[data-v]{cursor:pointer}.gizmo text{font:700 11px Inter,system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;fill:#0d1016;pointer-events:none}.gizmo circle{transition:r .1s}.gizmo g[data-v]:hover circle{r:11.5}
.plates{position:absolute;inset:0;padding:22px;overflow:auto;display:none;flex-wrap:wrap;gap:24px;align-content:flex-start;justify-content:center;z-index:4}
.plate h5{margin:0 0 8px;font-size:13px;font-weight:600}.plate svg{display:block}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tabs button{height:28px;padding:0 10px;border-radius:7px;border:0;background:transparent;color:#9aa3b2;font-size:12px;cursor:pointer}
.tabs button.on{background:var(--on);color:#e6e9ef;font-weight:600}
.tabs .count{margin-left:5px;font-size:10.5px;color:var(--dim)}
.stats{flex:0 0 auto;max-height:34vh;overflow:auto;padding:6px 10px;border-bottom:1px solid var(--line);font-size:12px}
.row{display:flex;align-items:center;gap:7px;padding:4px 4px;border-radius:6px;cursor:pointer;min-height:27px}.row:hover{background:var(--btn)}
.row input{margin:0;accent-color:var(--orange)}.sw{width:9px;height:9px;border-radius:3px;flex:none}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font:10.5px var(--mono);color:var(--dim);white-space:nowrap}.tag.warn{color:var(--warn)}.tick{font-size:11px;width:12px;text-align:center}.tick.ok{color:var(--ok)}.tick.bad{color:var(--bad)}
.more{margin:2px 0 7px 20px;font-size:11.5px;color:var(--soft)}.more .bad{color:var(--bad)}.more .warn{color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}td,th{padding:2px 4px;text-align:left;font-weight:400;border-bottom:1px solid var(--line)}th{color:var(--dim)}tr.best td{color:var(--ok)}
.links{display:flex;gap:10px;margin-top:5px}.links a{color:var(--blue);font-size:11.5px}
.muted{color:var(--dim);padding:4px}
.agenthead{display:flex;align-items:center;gap:8px;padding:8px 12px;font:12px var(--mono);border-bottom:1px solid var(--line)}.agenthead .st{color:var(--dim)}
.stop{height:24px;padding:0 9px;font-size:11px}
.log{flex:1;min-height:0;overflow:auto;padding:12px 14px;font:12px/1.5 var(--mono)}
.ev{margin:0 0 10px 14px;position:relative;white-space:pre-wrap;word-break:break-word;color:var(--soft)}.ev:before{content:"●";position:absolute;left:-14px;color:var(--dim)}
.ev.user{color:#fff;background:#171c26;margin-left:0;padding:6px 9px;border-radius:6px}.ev.user:before{content:""}
.ev.tool:before,.ev.done:before{color:var(--ok)}.ev.error,.ev.error:before{color:var(--bad)}.ev.note:before{color:var(--warn)}.ev.build:before{color:var(--blue)}.ev b{color:var(--text);font-weight:500}
.working{padding:0 14px 6px;font:12px var(--mono);color:var(--warn);min-height:20px}
.input{margin:0 10px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);padding:8px 10px}.input:focus-within{border-color:var(--orange)}
textarea{width:100%;background:none;border:0;outline:0;resize:none;height:54px;font:12.5px/1.45 Inter,system-ui,sans-serif;display:block}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:14px;padding:18px;width:380px}dialog::backdrop{background:rgba(5,7,11,.65)}
dialog h3{margin:0 0 6px;font-size:16px}dialog p{margin:0 0 12px;color:var(--soft)}
dialog input{width:100%;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--bg);padding:0 12px;outline:0}dialog input:focus{border-color:var(--orange)}
.derr{color:var(--bad);font-size:12px;min-height:18px;margin:7px 0 2px}.dfoot{display:flex;justify-content:flex-end;gap:8px}.btn.danger{background:#c9422f;border-color:#c9422f;color:#fff;font-weight:600}
[hidden]{display:none!important}
@media (max-width:980px){body{overflow:auto;height:auto}.app{grid-template-columns:1fr}nav{flex-direction:row;justify-content:center;border-right:0;padding:6px}.view{height:55vh}aside{border-left:0;height:80vh}header{flex-wrap:wrap;height:auto;padding:8px;row-gap:6px}body{grid-template-rows:auto auto}}

</header>
<div class="app">
  <nav aria-label="Views">

    <button class="hv" data-page="plates"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/></svg>Plates</button>
  </nav>
  <main class="view" id="view">
    <div class="empty" id="empty"></div>
    <div class="plates" id="plates"></div>
    <div class="alert" id="alert" hidden></div>
    <div class="tools" id="tools" role="toolbar" aria-label="3D tools">
      <button class="hv" data-v="iso" title="Corner view">Iso</button>
      <button class="hv" data-v="top" title="From above">Top</button>
      <button class="hv" data-v="front" title="From the front">Front</button>
      <button class="hv" data-v="fit" title="Fit to view" aria-label="Fit to view"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      <hr>

</div>

$("tools").onclick=e=>{const b=e.target.closest("[data-v]");if(b)setView(b.dataset.v)};
function applyExplode(){const parts=Object.values(meshes);parts.forEach(m=>m.position.set(0,0,0));if(!exploded||parts.length<2)return;const box=bounds(),c=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),reach=Math.max(size.x,size.y,size.z)*.45;
 parts.forEach((m,i)=>{const own=new THREE.Box3().setFromObject(m).getCenter(new THREE.Vector3());const d=own.clone().sub(c);if(d.length()<1e-3)d.set(0,0,i%2?1:-1);if(Math.abs(d.z)>=Math.max(Math.abs(d.x),Math.abs(d.y))*.5)d.set(0,0,Math.sign(d.z)||1);m.position.copy(d.normalize().multiplyScalar(reach))})}
$("explode").onclick=()=>{exploded=!exploded;$("explode").classList.toggle("on",exploded);$("explode").setAttribute("aria-pressed",exploded);applyExplode();setView("fit")};
function applyXray(){Object.values(meshes).forEach(m=>{const mat=m.children[0].material;mat.transparent=xray;mat.opacity=xray?.32:1;mat.depthWrite=!xray;mat.needsUpdate=true})}
$("xray").onclick=()=>{xray=!xray;$("xray").classList.toggle("on",xray);$("xray").setAttribute("aria-pressed",xray);applyXray()};
(function loop(){requestAnimationFrame(loop);controls.update();sun.position.copy(camera.position);drawGizmo();renderer.render(scene,camera)})();
const loader=new STLLoader();
async function loadModel(r){const geos=await Promise.all(r.parts.map(p=>loader.loadAsync(`${BASE}/files/v${r.version}/${encodeURIComponent(p.name)}.stl`)));
 group.clear();for(const k in meshes)delete meshes[k];
 geos.forEach((g,i)=>{const m=new THREE.Group();m.add(new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:partColor(r,i),roughness:.62,metalness:.05,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1})));
  m.add(new THREE.LineSegments(new THREE.EdgesGeometry(g,28),new THREE.LineBasicMaterial({color:0x101216})));group.add(m);meshes[r.parts[i].name]=m});
 $("empty").style.display="none";const first=!loaded;loaded=r.version;applyExplode();applyXray();setView(first?"iso":"fit");renderChips(r)}

/* details */
let tab="parts",openPart=null,report=null;
function renderChips(r){const box=$("chips");box.replaceChildren();const chip=(b,t)=>{const s=el("span");s.append(el("b","",b)," ",t);box.append(s)};const n=r.parts.reduce((a,p)=>a+(p.bought?0:p.quantity),0),nb=r.parts.filter(p=>p.bought).length;chip(String(n),n===1?"part":"parts");if(nb)chip(String(nb),"bought");const b=exploded?null:bounds();if(b&&!b.isEmpty()){const s=b.getSize(new THREE.Vector3());chip(`${s.x.toFixed(0)}×${s.y.toFixed(0)}×${s.z.toFixed(0)}`,"mm")}const sup=r.parts.filter(p=>p.check.needs_support).length;chip(sup?String(sup):"No",sup?"need support":"supports");chip(String(r.plates.length),r.plates.length===1?"plate":"plates")}
function renderTabs(r){const box=$("tabs");box.replaceChildren();[["parts","Parts",r.parts.length],["fit","Fit",r.fits.length],["plates","Plates",r.plates.length]].forEach(([id,label,n])=>{const b=el("button","hv"+(tab===id?" on":""),label);b.setAttribute("role","tab");b.setAttribute("aria-selected",tab===id);b.append(el("span","count",String(n)));b.onclick=()=>{tab=id;render()};box.append(b)})}
function table(head,rows){const t=el("table"),h=el("tr");head.forEach(c=>h.append(el("th","",c)));t.append(h);rows.forEach(r=>{const tr=el("tr",r.cls||"");r.cells.forEach(c=>tr.append(el("td","",c)));t.append(tr)});return t}
function partDetail(p,r){const d=el("div","more"),c=p.check;if(p.bought){d.append(el("div","","Bought, not printed. Size "+p.size.map(v=>v.toFixed(1)).join(" × ")+" mm."));return d}c.errors.forEach(t=>d.append(el("div","bad",t)));c.warnings.forEach(t=>d.append(el("div","warn",t)));d.append(table(["Face down","Overhang","Contact","Height"],c.orientations.map(o=>({cls:o.down===c.chosen?"best":"",cells:[o.down+(o.down===c.chosen?" ✓":""),o.overhang_area.toFixed(0)+" mm²",o.bed_contact.toFixed(0)+" mm²",o.height.toFixed(0)+" mm"]}))));const l=el("div","links");["step","stl","3mf"].forEach(s=>{const a=el("a","",s.toUpperCase());a.href=`${BASE}/files/v${r.version}/${encodeURIComponent(p.name)}.${s}`;a.download="";l.append(a)});d.append(l);return d}
function renderStats(r){const box=$("stats"),top=box.scrollTop;box.replaceChildren();
 if(tab==="parts"){r.parts.forEach((p,i)=>{const row=el("div","row"),eye=el("input");eye.type="checkbox";eye.title="Show or hide";eye.setAttribute("aria-label",`Show ${p.name}`);eye.checked=meshes[p.name]?meshes[p.name].visible:true;eye.onclick=e=>{e.stopPropagation();if(meshes[p.name])meshes[p.name].visible=eye.checked};
  const sw=el("span","sw");sw.style.background="#"+partColor(r,i).toString(16).padStart(6,"0");row.append(eye,sw,el("span","name",p.name+(p.quantity>1?` ×${p.quantity}`:"")),el("span","tag",p.bought?"bought":p.check.chosen?`${p.check.chosen} down`:"no face"));if(p.check.needs_support)row.append(el("span","tag warn","support"));row.append(el("span","tick "+(p.check.passed?"ok":"bad"),p.check.passed?"✓":"✕"));row.onclick=()=>{openPart=openPart===p.name?null:p.name;render()};box.append(row);if(openPart===p.name)box.append(partDetail(p,r))})}
 if(tab==="fit"){if(r.fits.length)box.append(table(["Pair","Gap","Needs",""],r.fits.map(f=>({cells:[`${f.a} / ${f.b}`,f.measured===null?"clear":f.measured.toFixed(2),f.required.toFixed(2),f.passed?"✓":"✕"]}))));else box.append(el("div","muted","One part, nothing to fit."))}
 if(tab==="plates"){if(r.plate_error)box.append(el("div","more bad",r.plate_error));box.append(table(["Plate","Parts"],r.plates.map(x=>({cells:[x.name,String(x.parts.length)]}))))}
 box.scrollTop=top}
function renderPlates(r){const box=$("plates");box.replaceChildren();const NS="http://www.w3.org/2000/svg",W=r.bed.width,D=r.bed.depth;r.plates.forEach(pl=>{const wrap=el("div","plate");wrap.append(el("h5","",pl.name));const s=document.createElementNS(NS,"svg");s.setAttribute("viewBox",`-2 -2 ${W+4} ${D+4}`);s.setAttribute("width",320);s.setAttribute("height",320);
 const rect=(x,y,w,h,f,st)=>{const e=document.createElementNS(NS,"rect");e.setAttribute("x",x);e.setAttribute("y",D-y-h);e.setAttribute("width",w);e.setAttribute("height",h);e.setAttribute("fill",f);e.setAttribute("stroke",st);e.setAttribute("rx",1);return e};
 s.append(rect(0,0,W,D,"#171c26","#3b4658"));pl.parts.forEach((p,i)=>{s.append(rect(p.x,p.y,p.width,p.depth,hex(i),"#0d1016"));if(p.width>W*.15){const t=document.createElementNS(NS,"text");t.setAttribute("x",p.x+p.width/2);t.setAttribute("y",D-p.y-p.depth/2+3);t.setAttribute("text-anchor","middle");t.setAttribute("font-size",W/28);t.setAttribute("fill","#0d1016");t.textContent=p.name;s.append(t)}});wrap.append(s);box.append(wrap)})}
function renderHint(){$("synced").replaceChildren(`View: ${viewName.toUpperCase()}`,...(report?[" · ",el("span","synced",`● synced v${report.version}`)]:[]))}
function render(){if(!report)return;const r=report;$("download").href=`${BASE}/files/v${r.version}/plates.3mf`;$("download").download=`${(state.name||"project").replace(/[^\p{L}\p{N} _-]/gu,"")}.3mf`;$("source").href=`${BASE}/files/v${r.version}/model.py`;renderTabs(r);renderStats(r);renderPlates(r);renderHint()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));const p=b.dataset.page==="plates";$("plates").style.display=p?"flex":"none";onPlates=p;applyChrome();renderer.domElement.style.visibility=p?"hidden":"visible"});

let onPlates=false;
function applyChrome(){const has=!!report;["tools","chips","hint","gizmo"].forEach(i=>$(i).style.display=(has&&!onPlates)?"":"none");["download","source"].forEach(i=>$(i).style.display=has?"":"none");$("tabs").style.display=has?"":"none";$("stats").style.display=has?"":"none"}
function renderEmpty(){const box=$("empty");if(report){box.style.display="none";return}box.style.display="";const key=busy?"busy":state.empty?"empty":"build";if(box.dataset.key===key)return;box.dataset.key=key;box.replaceChildren();if(key==="empty"){box.append(el("div","","Nothing here yet."));box.lastChild.append(el("small","","Describe what you want to make in the chat on the right."))}else box.textContent=key==="busy"?"Working on the first version…":"Building…"}
/* status and chat */
let state={},seq=0,busy=false,lastKey="";
function renderStatus(){const p=$("status"),r=report;if(busy){p.className="pill run";p.textContent="working…";return}if(state.error){p.className="pill bad";p.textContent="last change failed";return}if(!r){p.className="pill";p.textContent=state.empty?"empty":"building";return}const warn=r.parts.reduce((n,x)=>n+x.check.warnings.length,0);p.className="pill "+(r.passed?"ok":"bad");p.textContent=r.passed?`v${r.version} · checks passed${warn?` · ${warn} warning${warn>1?"s":""}`:""}`:`v${r.version} · checks failed`;p.title="Measured on the model. Not printed yet."}
const LABEL={tool:"Ran",build:"Build",done:"Done",note:"Check",error:"Error"};
function addEvent(e){const box=$("log"),stick=box.scrollHeight-box.scrollTop-box.clientHeight<60,d=el("div","ev "+e.kind);if(LABEL[e.kind]){d.append(el("b","",LABEL[e.kind]+" "),document.createTextNode(e.text))}else d.textContent=e.text;box.append(d);if(stick)box.scrollTop=box.scrollHeight}
async function poll(){try{const res=await fetch(`${BASE}/api/state?since=${seq}`);if(res.status===404){location.href="/";return}state=await res.json();state.events.forEach(addEvent);seq=state.seq;busy=state.status!=="idle";
 $("agentstate").textContent=busy?"working":"idle";$("stop").hidden=!busy;$("working").textContent=busy?`● Working (${state.elapsed}s · esc to interrupt)`:"";$("project").textContent=state.name;document.title=`${state.name} · cadsmith`;
 const a=$("alert");if(state.error){a.hidden=false;a.textContent=(report?"The latest change did not build. Showing the last good version.\n":"The model did not build.\n")+state.error.trim().split("\n").slice(-2).join("\n")}else a.hidden=true;
 if(state.report){report=state.report;if(report.version!==loaded)await loadModel(report);const key=JSON.stringify([report.version,tab,openPart,state.name]);if(key!==lastKey){lastKey=key;render();renderChips(report)}}applyChrome();renderEmpty();renderStatus()}catch(e){$("agentstate").textContent="disconnected"}setTimeout(poll,800)}
$("text").onkeydown=async e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();const t=$("text").value.trim();if(!t||busy)return;$("text").value="";const r=await post(`${BASE}/api/chat`,{message:t});if(!r.ok){$("text").value=t;addEvent({kind:"error",text:r.data.error||"could not send"})}}};
const stop=()=>post(`${BASE}/api/stop`);$("stop").onclick=stop;addEventListener("keydown",e=>{if(e.key==="Escape"&&busy&&!$("dlg").open)stop()});

/* projects */
async function openMenu(){const m=$("menu");if(!m.hidden){m.hidden=true;$("switch").setAttribute("aria-expanded","false");return}const{projects}=await (await fetch("/api/projects")).json();m.replaceChildren();projects.forEach(p=>{const a=el("a",p.id===projectId?"on":"");a.href=`/p/${p.id}/`;a.append(el("span","dot "+(p.status!=="idle"?"run":p.passed?"ok":p.passed===false?"bad":"")),el("span","n",p.name),el("span","v",p.version?`v${p.version}`:"new"));m.append(a)});m.hidden=false;$("switch").setAttribute("aria-expanded","true")}
$("switch").onclick=e=>{e.stopPropagation();openMenu()};document.addEventListener("click",e=>{if(!$("menu").contains(e.target)){$("menu").hidden=true;$("switch").setAttribute("aria-expanded","false")}});
let dialogAction=null;
function ask({title,text,value,ok,danger,input=true,action}){$("dtitle").textContent=title;$("dtext").textContent=text||"";$("dtext").hidden=!text;$("dinput").hidden=!input;$("dinput").value=value||"";$("derr").textContent="";$("dok").textContent=ok;$("dok").className="btn "+(danger?"danger":"primary");dialogAction=action;$("dlg").showModal();if(input){$("dinput").focus();$("dinput").select()}}
$("dcancel").onclick=()=>$("dlg").close();
$("dform").onsubmit=async e=>{e.preventDefault();const r=await dialogAction($("dinput").value);if(r.ok)$("dlg").close();if(!r.ok)$("derr").textContent=r.data.error||"That did not work."};
const go=id=>{location.href=id?`/p/${id}/`:"/"};
$("new").onclick=()=>ask({title:"New project",text:"Starts empty. Describe what you want in the chat.",ok:"Create",action:async name=>{const r=await post("/api/projects",{name});if(r.ok)go(r.data.id);return r}});
$("rename").onclick=()=>ask({title:"Rename project",value:state.name,ok:"Rename",action:async name=>{const r=await post(`${BASE}/api/rename`,{name});if(r.ok){state.name=r.data.name;$("project").textContent=r.data.name}return r}});
$("delete").onclick=()=>ask({title:`Delete “${state.name}”?`,text:"The model, its versions and its chat leave the list. A copy stays in the .trash folder.",input:false,ok:"Delete",danger:true,action:async()=>{const r=await post(`${BASE}/api/delete`);if(r.ok)go();return r}});
poll();
</script>
</body>
