[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cadsmith"
version = "0.1.0"
description = "Parametric CadQuery parts checked for printability and fit, laid out on Bambu Lab plates."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "cadquery>=2.5,<2.8",
    "numpy>=1.26,<3",
    "matplotlib>=3.8",
    "fast-simplification>=0.1.7",
]

[project.scripts]
cadsmith = "cadsmith.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/cadsmith"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slicer: needs a local BambuStudio install (skipped when absent)"]
